name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Lockfile multiplataforma versionado; npm ci garante build reproduzível.
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: scripts/ci-step.sh npm run typecheck
      - name: Lint
        if: ${{ !cancelled() }}
        run: scripts/ci-step.sh npm run lint
      - name: Testes
        if: ${{ !cancelled() }}
        run: scripts/ci-step.sh npm test
      - name: Build
        if: ${{ !cancelled() }}
        run: scripts/ci-step.sh npm run build

  # Testes PostgreSQL de integração OBRIGATÓRIOS: sobe um Postgres 16
  # descartável (serviço do GitHub Actions) e trunca os dados a cada teste —
  # nunca aponte a suíte para um banco que importe.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Testes PostgreSQL
        run: npm run test:pg
        env:
          PG_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          PG_TEST_SSL: 'false'
